name: Build Register Service

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'bbhealthapp-backend/bbhealthapp-api-register/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-region: us-west-2
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
      
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
      
      - name: Build Docker image
        run: |
          docker build -t ${{ steps.login-ecr.outputs.registry }}/bbhealthapp-register-service:latest bbhealthapp-backend/bbhealthapp-api-register/
      
      - name: Push Docker image
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/bbhealthapp-register-service:latest
