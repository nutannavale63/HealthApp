apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bbhealthapp-ingress
  namespace: bbhealthapp
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
spec:
  ingressClassName: alb
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
      - path: /api/master
        pathType: Prefix
        backend:
          service:
            name: master-service
            port:
              number: 8080
      - path: /api/register
        pathType: Prefix
        backend:
          service:
            name: register-service
            port:
              number: 8082
      - path: /api/document
        pathType: Prefix
        backend:
          service:
            name: document-service
            port:
              number: 8080
