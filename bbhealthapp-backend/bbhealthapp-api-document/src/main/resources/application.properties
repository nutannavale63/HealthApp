spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# =========================
# SERVER (INSIDE CONTAINER)
# =========================
server.port=8083

# =========================
# DATASOURCE
# =========================
spring.datasource.url=jdbc:h2:file:~/binarybrainscovid
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# =========================
# SECURITY / TOKEN
# =========================
token.secret=BinaryBrainsCovid@%^%@^!@$!@$@#$#$#6763276327

server.error.include-message=always

app.testrun=false

spring.jackson.serialization.fail-on-empty-beans=false

# =========================
# MULTIPART CONFIG
# =========================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=2KB
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# =========================
# FILE STORAGE
# =========================
file.upload-dir=useruploads

# =========================
# MASTER SERVICE (DOCKER SAFE)
# =========================
MASTER_SVC_HOST=master-service
MASTER_SVC_PORT=8080

rootURL=http://${MASTER_SVC_HOST}:${MASTER_SVC_PORT}
server.servlet.context-path=/api/document
