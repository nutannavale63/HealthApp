apiVersion: v1
kind: ConfigMap
metadata:
  name: bbhealthapp-config
  namespace: {{ .Values.global.namespace }}
data:
  MASTER_SVC_HOST: "master-service"
  MASTER_SVC_PORT: "8080"
  REGISTER_SVC_HOST: "register-service"
  REGISTER_SVC_PORT: "8082"
  DOCUMENT_SVC_HOST: "document-service"
  DOCUMENT_SVC_PORT: "8080"
  SPRING_PROFILES_ACTIVE: {{ .Values.masterService.env.spring_profiles_active }}
  REACT_APP_API_BASE_URL: {{ .Values.frontend.env.REACT_APP_API_BASE_URL | default "/api" }}
