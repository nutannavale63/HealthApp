{{- if .Values.autoscaling.enabled }}
{{- if .Values.masterService.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Values.masterService.name }}-hpa
  namespace: {{ .Values.global.namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Values.masterService.name }}
  minReplicas: {{ .Values.autoscaling.masterService.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.masterService.maxReplicas }}
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: {{ .Values.autoscaling.masterService.targetCPUUtilizationPercentage }}
{{- end }}
---
