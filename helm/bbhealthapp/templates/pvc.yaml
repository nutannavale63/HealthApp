{{- if .Values.masterService.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: master-data-pvc
  namespace: {{ .Values.global.namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.masterService.persistence.data.size }}
  storageClassName: {{ .Values.masterService.persistence.data.storageClass }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: master-uploads-pvc
  namespace: {{ .Values.global.namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.masterService.persistence.uploads.size }}
  storageClassName: {{ .Values.masterService.persistence.uploads.storageClass }}
{{- end }}
