{{- if .Values.registerService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.registerService.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ .Values.registerService.name }}
spec:
  replicas: {{ .Values.registerService.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.registerService.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.registerService.name }}
    spec:
      imagePullSecrets:
      - name: ecr-pull-secret
      nodeSelector:
        kubernetes.io/arch: arm64
      containers:
      - name: {{ .Values.registerService.name }}
        image: "{{ .Values.image.registry }}/{{ .Values.registerService.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        ports:
        - containerPort: {{ .Values.registerService.service.port }}
          name: http
        env:
        - name: SPRING_PROFILES_ACTIVE
          valueFrom:
            configMapKeyRef:
              name: bbhealthapp-config
              key: SPRING_PROFILES_ACTIVE
        - name: token.secret
          valueFrom:
            secretKeyRef:
              name: bbhealthapp-secret
              key: token-secret
        - name: MASTER_SVC_HOST
          value: "master-service"
        - name: MASTER_SVC_PORT
          value: "8080"
        - name: rootURL
          value: {{ .Values.registerService.env.rootURL }}
        {{- if .Values.registerService.persistence.enabled }}
        volumeMounts:
        - name: register-data
          mountPath: /root
        - name: register-uploads
          mountPath: /app/useruploads
        {{- end }}
        resources:
          {{- toYaml .Values.registerService.resources | nindent 10 }}
        readinessProbe:
          tcpSocket:
            port: {{ .Values.registerService.service.port }}
          initialDelaySeconds: 10
          periodSeconds: 5
      {{- if .Values.registerService.persistence.enabled }}
      volumes:
      - name: register-data
        persistentVolumeClaim:
          claimName: register-data-pvc
      - name: register-uploads
        persistentVolumeClaim:
          claimName: register-uploads-pvc
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.registerService.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ .Values.registerService.name }}
spec:
  type: {{ .Values.registerService.service.type }}
  ports:
  - port: {{ .Values.registerService.service.port }}
    targetPort: {{ .Values.registerService.service.port }}
    protocol: TCP
    name: http
  selector:
    app: {{ .Values.registerService.name }}
{{- end }}
